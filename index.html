<script>
// V2 FIX - Bot Penghemat Kuota
(function(){
  try{
    // Default yang benar: harian 1000 MB, bulanan 10000 MB
    if(!localStorage.getItem('kuota_v2_init')){
      localStorage.setItem('kuota_harian','1000');
      localStorage.setItem('kuota_bulanan','10000');
      localStorage.setItem('kuota_v2_init','1');
    }
    // Notifikasi getar saat 80% dan 100%
    const origAlert = window.alert;
    // Pantau perubahan teks status via MutationObserver untuk getar
    const obs = new MutationObserver(()=>{
      const txt = document.body.innerText || '';
      if(txt.includes('TERPUTUS') || txt.includes('100%')){
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
      } else if(txt.includes('Peringatan') || txt.includes('80%')){
        if(navigator.vibrate) navigator.vibrate(100);
      }
    });
    obs.observe(document.body, {childList:true, subtree:true, characterData:true});
    console.log('KuotaBot V2 aktif - Bulanan 10GB, tersimpan otomatis');
  }catch(e){ console.log('V2 init', e); }
})();
</script>
